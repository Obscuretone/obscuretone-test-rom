name: Release OTR .gb ROMs

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test generator
        run: pytest

      - name: Build and verify .gb ROMs
        run: |
          python generate.py --output dist
          python generate.py --output dist --check

      - name: Package release
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          zip -9 -r "obscuretone-test-rom-${GITHUB_REF_NAME}.zip" \
            dist README.md BLOG.md LICENSE SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "obscuretone-test-rom-${GITHUB_REF_NAME}.zip"
          SHA256SUMS
          --generate-notes
