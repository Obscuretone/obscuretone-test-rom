name: Release OTR .gb ROMs

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run quality gates
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          pytest

      - name: Build and verify .gb ROMs
        run: |
          otr-build --output dist
          otr-verify dist
          otr-build --output dist --check

      - name: Package release
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          zip -9 -r "obscuretone-test-rom-${GITHUB_REF_NAME}.zip" \
            dist README.md LICENSE SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            obscuretone-test-rom-${{ github.ref_name }}.zip
            SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "obscuretone-test-rom-${GITHUB_REF_NAME}.zip"
          SHA256SUMS
          --verify-tag
          --generate-notes
