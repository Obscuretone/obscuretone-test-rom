name: Release OTR .gb ROMs

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run quality gates
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          pytest

      - name: Build and verify .gb ROMs
        run: |
          otr-build --output dist
          otr-verify dist
          otr-build --output dist --check

      - name: Package release
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          zip -9 -r "obscuretone-test-rom-${GITHUB_REF_NAME}.zip" \
            dist README.md LICENSE SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            obscuretone-test-rom-${{ github.ref_name }}.zip
            SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "obscuretone-test-rom-${GITHUB_REF_NAME}.zip"
          SHA256SUMS
          --verify-tag
          --generate-notes
