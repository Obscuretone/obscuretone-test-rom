name: Build OTR .gb ROMs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test generator
        run: pytest

      - name: Build .gb ROMs
        run: python generate.py --output dist

      - name: Verify reproducibility
        run: python generate.py --output dist --check

      - name: Upload .gb ROMs
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: otr-gb-roms
          path: |
            dist/otr.gb
            dist/controllers/*.gb
            dist/probes/*.gb
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30
