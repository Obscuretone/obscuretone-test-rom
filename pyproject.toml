[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obscuretone-test-rom"
version = "0.1.0"
description = "Obscuretone's self-checking DMG opcode and subsystem diagnostic ROM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan D'Entremont" }]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Repository = "https://github.com/Obscuretone/obscuretone-test-rom"
Issues = "https://github.com/Obscuretone/obscuretone-test-rom/issues"

[project.scripts]
otr-build = "generate:main"

[tool.setuptools]
py-modules = ["generate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
